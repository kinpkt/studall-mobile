name: studall
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  # firebase_auth: ^6.1.4
  firebase_auth: ^6.1.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.0
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  # google_sign_in: ^7.2.0
  json_annotation: ^4.9.0
  phosphor_flutter: ^2.1.0
  shadcn_ui: ^0.45.1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
