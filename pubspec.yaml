name: studall
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  camera: ^0.11.4
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_initicon: ^3.0.1
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.2.0
  flutter_svg: ^2.2.3
  geolocator: ^14.0.2
  google_fonts: ^6.3.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.1
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  phosphor_flutter: ^2.1.0
  shadcn_ui: ^0.45.1
  step_progress_indicator: ^1.0.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/logos/


  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
